name: bluebuild
on:
  schedule:
    # Weekly rebuild so base-image and Fedora security updates reach the host even
    # when nothing in this repo changed (Sundays 06:00 UTC, after the ublue base
    # images finish their daily build). Every build is also tagged by date
    # (YYYYMMDD and YYYYMMDD-<fedora version>) next to latest.
    - cron: "0 6 * * 0"
  push:
    branches:
      - main
    paths-ignore: # don't rebuild when nothing that lands in the image changed
      - "**.md"
      - ".claude/**"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
      - ".gitignore"
      - "LICENSE"

  pull_request:
    paths-ignore: # don't rebuild a PR when nothing that lands in the image changed
      - "**.md"
      - ".claude/**"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
      - ".gitignore"
      - "LICENSE"

  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    if: ${{ !contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true

  # Tag the commit that was built with the same date the image was tagged with
  # (YYYYMMDD), so a package version like ghcr.io/postlmc/unidentified-device:20261106
  # maps to a git tag of the same name. A second build on the same day moves both
  # the image tag and this git tag, so the two always agree.
  tag:
    name: Tag Built Commit
    needs: bluebuild
    if: ${{ github.event_name != 'pull_request' && needs.bluebuild.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag commit with the image date tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(date -u +%Y%m%d)"
          ref="refs/tags/${tag}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/${ref}" > /dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/${ref}" -f sha="${GITHUB_SHA}" -F force=true
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="${ref}" -f sha="${GITHUB_SHA}"
          fi

---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: unidentified-device
# description will be included in the image's metadata
description: OS image for my not-quite-a-Mac

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/aurora-dx-nvidia-open
image-version: stable # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  # Converted from the rpm-ostree module: rpm-ostree cannot run inside the
  # build container on bootc/Fedora 43 bases ("This system was not booted via
  # libostree"), which failed every build since Dec 2025. dnf is the replacement.
  # optfix is intentionally gone -- BlueBuild CLI >= v0.9.23 applies it automatically.
  # For RPM Fusion, this module supports `nonfree: rpmfusion` under repos.
  - type: dnf
    repos:
      copr:
        - atim/starship
      files:
        # tailscale.repo dropped: the Aurora base now ships tailscale 1.102.3,
        # which matches upstream stable, so the extra repo is redundant.
        - 1password.repo
    install:
      packages:
        - micro
        - starship
        - firefox
        - firefox-langpacks
        - 1password
        - 1password-cli
        # Removed 2026-08-26, all of which broke the dnf transaction:
        #   tailscale, zsh -- already present in the Aurora DX base image
        #   git-credential-manager -- no longer in any configured repo, and it
        #     was neither installed nor set as git's credential.helper

  # Bake an empty /nix into the image so the Determinate Nix installer can
  # bind-mount onto it. See docs/nix-on-aurora.md for why this is necessary.
  - type: script
    scripts:
      - create-nix-dir.sh

  - type: default-flatpaks
    notify: true # Send notification after install/uninstall is finished (true/false)
    system:
      # If no repo information is specified, Flathub will be used by default
      install:
        - cc.arduino.IDE2
        - com.discordapp.Discord
        - com.dosbox_x.DOSBox-X
        - one.flipperzero.qFlipper
        - com.makemkv.MakeMKV
        - com.valvesoftware.Steam
        - io.github.shiftey.Desktop
        - com.usebruno.Bruno
        - org.freecad.FreeCAD
        - org.videolan.VLC
        - org.signal.Signal
        - org.wireshark.Wireshark
        - org.meshtastic.meshtasticd
      remove:
        - org.gnome.eog
        - org.mozilla.firefox
    user: {} # Also add Flathub user repo, but no user packages

  - type: signing # this sets up the proper policy & signing files for signed images to work fully

# Pin 1Password's group GIDs.
#
# 1Password setgids /usr/bin/op and 1Password-BrowserSupport to these groups, and
# the desktop app verifies connecting peers against them via SO_PEERCRED. The RPM
# scriptlets create the groups with whatever GID is next free *in the build
# container*, which does not match the live system -- and ostree never merges new
# groups into a locally-modified /etc/group, so the setgid resolves to a GID that
# means something else (or nothing) at runtime. The app then logs:
#
#   peer was not in the correct application group, rejecting remote
#
# Pinning here makes the GIDs deterministic across rebuilds.
#
# 1001 matches what this host already had, so the browser extension keeps working
# across the rebase with no action. 944/945 were chosen because they are free both
# in the image and on the host (1000 and 1002 collide with real user groups).
g onepassword     1001
g onepassword-cli 944
g onepassword-mcp 945

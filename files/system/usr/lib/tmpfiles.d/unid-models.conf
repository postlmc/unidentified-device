# Models directory for the local llama.cpp server. /var/mnt/data is root-owned, so create the
# directory owned by scott. The numeric uid/gid 1000 is deliberate: it matches the Quadlet path
# (/etc/containers/systemd/users/1000/, which must be numeric), and a user name that does not
# resolve makes systemd-tmpfiles skip the line instead of creating the directory.
d /var/mnt/data/models 0755 1000 1000 -
